name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least-privilege default; the release job overrides with contents: write.
permissions:
  contents: read

env:
  SOURCE_ARCHIVE: vendor/source/gifsicle-1.93.tar.gz

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin-x64 is cross-compiled from macos-14 (arm64). macos-13
          # runners have very limited capacity. Apple clang accepts
          # `-arch x86_64` and Rosetta lets configure run x86_64 test
          # programs against the build host.
          - id: darwin-x64
            runner: macos-14
            cross_arch: x86_64
          - id: darwin-arm64
            runner: macos-14
          - id: linux-x64
            runner: ubuntu-latest
          - id: linux-x64-musl
            runner: ubuntu-latest
            musl: true
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: linux-arm64-musl
            runner: ubuntu-24.04-arm
            musl: true
          - id: win32-x64
            runner: windows-latest
            windows: true

    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"

      # ── macOS ─ native arm64 build OR x64 cross-compile from arm64 host ──
      - name: Build (macOS)
        if: startsWith(matrix.runner, 'macos')
        env:
          CROSS_ARCH: ${{ matrix.cross_arch }}
        run: |
          set -euo pipefail
          brew install --quiet automake
          tmp=$(mktemp -d)
          tar -xzf "$SOURCE_ARCHIVE" -C "$tmp"
          cd "$tmp"/gifsicle-*
          host_arg=""
          if [ -n "${CROSS_ARCH:-}" ]; then
            export CFLAGS="-arch $CROSS_ARCH"
            export LDFLAGS="-arch $CROSS_ARCH"
            host_arg="--host=$CROSS_ARCH-apple-darwin"
          fi
          autoreconf -ivf
          ./configure $host_arg --disable-gifview --disable-gifdiff
          make -j"$(sysctl -n hw.ncpu)"
          strip src/gifsicle
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src/gifsicle "$GITHUB_WORKSPACE/out/"

      # ── Linux glibc (native; x64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) ──
      - name: Build (Linux glibc)
        if: startsWith(matrix.runner, 'ubuntu') && !matrix.musl
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y autoconf automake libtool make
          tmp=$(mktemp -d)
          tar -xzf "$SOURCE_ARCHIVE" -C "$tmp"
          cd "$tmp"/gifsicle-*
          autoreconf -ivf
          ./configure --disable-gifview --disable-gifdiff
          make -j"$(nproc)"
          strip src/gifsicle
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src/gifsicle "$GITHUB_WORKSPACE/out/"

      # ── Linux musl (via alpine docker — works on x64 or arm64 host) ──
      - name: Build (Linux musl via Alpine docker)
        if: matrix.musl
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            alpine:3.20 sh -c '
              set -e
              apk add --no-cache autoconf automake libtool make gcc musl-dev tar
              tmp=$(mktemp -d)
              tar -xzf vendor/source/gifsicle-1.93.tar.gz -C "$tmp"
              cd "$tmp"/gifsicle-*
              autoreconf -ivf
              ./configure --disable-gifview --disable-gifdiff
              make -j"$(nproc)"
              strip src/gifsicle
              mkdir -p /work/out
              cp src/gifsicle /work/out/
            '

      # ── Windows (MSYS2 + mingw, statically linked so consumer doesn't need DLLs) ──
      - name: Set up MSYS2
        if: matrix.windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            make

      - name: Build (Windows MSYS2)
        if: matrix.windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -xzf vendor/source/gifsicle-1.93.tar.gz -C "$tmp"
          cd "$tmp"/gifsicle-*
          autoreconf -ivf
          ./configure --disable-gifview --disable-gifdiff LDFLAGS="-static -static-libgcc"
          make -j"$(nproc)"
          strip src/gifsicle.exe
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src/gifsicle.exe "$GITHUB_WORKSPACE/out/"

      # ── Verify the artifact actually runs on the build host (except
      #    darwin-x64 which is cross-built — gates the smoke test on arch) ──
      - name: Smoke test
        if: matrix.id != 'darwin-x64'
        shell: bash
        run: |
          set -euo pipefail
          ls -la out/
          if [ -f out/gifsicle.exe ]; then
            ./out/gifsicle.exe --version
          else
            ./out/gifsicle --version
          fi

      # ── Tarball; name has to match what lib/install.js asks for. ──
      - name: Tarball
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          name="gifsicle-${TAG}-${{ matrix.id }}.tar.gz"
          tar -czf "artifacts/${name}" -C out .
          ls -la artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.id }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Same auto-release-on-version-bump flow as node-expat.
  release:
    name: auto-release on version bump
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists on origin
        id: check_tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag does not exist — will release."
          fi

      - if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true

      - if: steps.check_tag.outputs.exists == 'false'
        run: ls -la artifacts/

      - if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
